[project]
name = "rqt21-api"
version = "0.1.0"
description = "RQT21 Growth OS API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "python-multipart>=0.0.12",
  "email-validator>=2.2",
  "phonenumbers>=9.0",
  "cryptography>=43.0",
  "httpx>=0.27",
  "redis>=5.1",
  "rq>=2.0",
  "boto3>=1.35",
  "sentry-sdk>=2.17",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
  "fakeredis>=2.26",
  "moto[s3]>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI relies on Depends()/Cookie()/Header() as defaults.
# UP042: StrEnum is 3.11+ but the mixin pattern is intentional for Pydantic v2 serialization.
ignore = ["E501", "B008", "UP042"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
