name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API (pytest + ruff)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rqt
          POSTGRES_PASSWORD: rqt
          POSTGRES_DB: rqt_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd="pg_isready -U rqt"
          --health-interval=3s
          --health-timeout=3s
          --health-retries=20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://rqt:rqt@localhost:5433/rqt_test
      DATABASE_URL: postgresql+psycopg://rqt:rqt@localhost:5433/rqt_test
      JWT_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Install deps
        working-directory: apps/api
        run: uv sync
      - name: Ruff
        working-directory: apps/api
        run: uv run ruff check .
      - name: Alembic upgrade
        working-directory: apps/api
        run: uv run alembic upgrade head
      - name: Pytest
        working-directory: apps/api
        run: uv run pytest

  web:
    name: Web (typecheck + lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web lint
      - run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
