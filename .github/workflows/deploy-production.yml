name: Deploy to production

# Manual only — never triggered by a push. The `environment: production`
# gate below is what actually enforces "requires manual approval": once a
# repo admin adds required reviewers to the "production" GitHub Environment
# (Settings -> Environments -> production -> Required reviewers), this job
# pauses and waits for one of them to approve before running. That
# protection rule has to be configured in the GitHub UI — it cannot be set
# from a workflow file — see infra/scripts/README.md "Fase 6B".
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit SHA to deploy (defaults to the tip of main)"
        required: false
        default: ""

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_API: ${{ github.repository }}/api
  IMAGE_WEB: ${{ github.repository }}/web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        run: |
          if [ -n "${{ inputs.sha }}" ]; then
            echo "sha=${{ inputs.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.resolve.outputs.sha }}

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:production
            ${{ env.REGISTRY }}/${{ env.IMAGE_API }}:production-${{ steps.resolve.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}:production
            ${{ env.REGISTRY }}/${{ env.IMAGE_WEB }}:production-${{ steps.resolve.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # This job's `environment: production` is the manual approval gate —
  # see the comment at the top of this file.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check deploy target configured
        id: check
        run: |
          if [ -n "${{ secrets.PROD_SSH_HOST }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PROD_SSH_HOST is not set — build/push succeeded but there is no production host to deploy to yet. See infra/scripts/README.md (Fase 6B)."
          fi

      - name: Deploy to production host over SSH
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            set -e
            cd /opt/rqt21-growth-os
            git fetch --tags
            git checkout ${{ needs.build-and-push.outputs.sha }}
            docker compose -f infra/docker-compose.prod.yml --env-file .env.production pull
            docker compose -f infra/docker-compose.prod.yml --env-file .env.production up -d
            docker compose -f infra/docker-compose.prod.yml --env-file .env.production \
              exec -T api uv run alembic upgrade head

      - name: Record deployed SHA for rollback
        if: steps.check.outputs.configured == 'true'
        run: echo "Deployed ${{ needs.build-and-push.outputs.sha }} — see rollback.yml to revert."
