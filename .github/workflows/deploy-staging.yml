name: Deploy to staging

# Fires only after CI (ci.yml) finishes successfully on main — never
# deploys code that hasn't passed pytest/ruff/typecheck/lint/build first.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      # Docker image refs must be lowercase; github.repository preserves the
      # owner's actual GitHub casing (e.g. "andyRS/rqt21-growth-os"), which
      # `docker buildx build --tag` rejects outright.
      - name: Compute lowercase image prefix
        id: image
        run: echo "prefix=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.prefix }}/api:staging
            ${{ env.REGISTRY }}/${{ steps.image.outputs.prefix }}/api:staging-${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.prefix }}/web:staging
            ${{ env.REGISTRY }}/${{ steps.image.outputs.prefix }}/web:staging-${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check deploy target configured
        id: check
        run: |
          if [ -n "${{ secrets.STAGING_SSH_HOST }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::STAGING_SSH_HOST is not set — build/push succeeded but there is no staging host to deploy to yet. See infra/scripts/README.md (Fase 6B) to point this at a real server."
          fi

      - name: Deploy to staging host over SSH
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGING_SSH_HOST }}
          username: ${{ secrets.STAGING_SSH_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            set -e
            cd /opt/rqt21-growth-os
            git fetch --tags
            git checkout ${{ needs.build-and-push.outputs.sha }}
            docker compose -f infra/docker-compose.staging.yml --env-file .env.staging pull
            docker compose -f infra/docker-compose.staging.yml --env-file .env.staging up -d
            docker compose -f infra/docker-compose.staging.yml --env-file .env.staging \
              exec -T api uv run alembic upgrade head
